# Revisão automática de merge requests com Claude Code.
# Cole este bloco no .gitlab-ci.yml do projeto (ou mescle com o que já existir)
# e adicione o arquivo scripts/claude-mr-review.sh ao repositório.

stages:
  - review

claude_mr_review:
  stage: review
  image: node:20-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true
  interruptible: true
  before_script:
    - apk add --no-cache bash curl jq ca-certificates
    - npm install --global @anthropic-ai/claude-code
  script:
    - bash scripts/claude-mr-review.sh
